    <!-- CSS ya Loading Screen -->
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      /* Animation ya Logo Kupumua */
      .loader-logo {
        width: 100px;
        margin-bottom: 25px;
        animation: breathe 2s ease-in-out infinite;
      }

      /* Animation ya Maandishi Kuja Taratibu */
      .loader-text {
        font-family: 'Inter', sans-serif;
        color: #0A2540;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 2px;
        animation: fadeInText 2s ease-in-out infinite;
      }

      /* Keyframes ya Kupumua (Kukua na Kupungua) */
      @keyframes breathe {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }

      /* Keyframes ya Maandishi Kufifia na Kuonekana */
      @keyframes fadeInText {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
      }
    </style>
  </head>
